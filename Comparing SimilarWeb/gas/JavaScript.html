<script>
/* ─── State ──────────────────────────────── */
let clientsCache = [];
let currentModalClientId = null;

/* ─── Tabs ───────────────────────────────── */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

    if (btn.dataset.tab === 'clients') loadClients();
    if (btn.dataset.tab === 'compare') loadCompareFilters();
    if (btn.dataset.tab === 'queue') loadQueue();
    if (btn.dataset.tab === 'settings') loadSettings();
  });
});

/* ─── Toast ──────────────────────────────── */
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  setTimeout(() => el.classList.add('hidden'), 3000);
}

/* ─── RPC wrapper ────────────────────────── */
function rpc(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e => reject(new Error(e.message || e)))
      [fn](...args);
  });
}

/* ═══════════════════════════════════════════
   CLIENTS
   ═══════════════════════════════════════════ */

async function loadClients() {
  const wrap = document.getElementById('clients-list');
  wrap.innerHTML = '<p class="loading">Loading...</p>';
  try {
    clientsCache = await rpc('getClients');
    renderClients(clientsCache);
  } catch (e) {
    wrap.innerHTML = '<p class="loading">Error: ' + e.message + '</p>';
  }
}

function renderClients(clients) {
  const wrap = document.getElementById('clients-list');
  if (!clients.length) { wrap.innerHTML = '<p class="hint">No clients yet. Add one above.</p>'; return; }

  wrap.innerHTML = clients.map(c => `
    <div class="card">
      <div class="card-header">
        <h3>${esc(c.client_site)}</h3>
        <div class="card-actions">
          <button class="btn-sm" onclick="openCompetitors('${c.id}', '${esc(c.client_site)}')">Competitors</button>
          <button class="btn-sm btn-danger" onclick="deleteClientHandler('${c.id}')">Delete</button>
        </div>
      </div>
      <div class="card-meta">Status: ${c.client_status || 'active'} &bull; Created: ${formatDate(c.created_at)}</div>
    </div>
  `).join('');
}

async function addClientHandler() {
  const input = document.getElementById('new-client-site');
  const site = input.value.trim();
  if (!site) return;
  try {
    await rpc('addClient', site);
    input.value = '';
    showToast('Client added', 'success');
    loadClients();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function deleteClientHandler(id) {
  if (!confirm('Delete this client and all its data?')) return;
  try {
    await rpc('deleteClient', id);
    showToast('Client deleted', 'success');
    loadClients();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

/* ═══════════════════════════════════════════
   COMPETITORS MODAL
   ═══════════════════════════════════════════ */

async function openCompetitors(clientId, clientSite) {
  currentModalClientId = clientId;
  document.getElementById('modal-client-name').textContent = clientSite;
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('new-competitor-site').value = '';
  await loadCompetitorsList(clientId);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  currentModalClientId = null;
}

async function loadCompetitorsList(clientId) {
  const wrap = document.getElementById('competitors-list');
  wrap.innerHTML = '<p class="loading">Loading...</p>';
  try {
    const comps = await rpc('getCompetitors', clientId);
    if (!comps.length) { wrap.innerHTML = '<p class="hint">No competitors yet.</p>'; return; }
    wrap.innerHTML = comps.map(c => `
      <div class="comp-row">
        <span>${esc(c.competitor_site)}</span>
        <button class="btn-sm btn-danger" onclick="deleteCompetitorHandler('${c.id}')">Remove</button>
      </div>
    `).join('');
  } catch (e) {
    wrap.innerHTML = '<p class="loading">Error: ' + e.message + '</p>';
  }
}

async function addCompetitorHandler() {
  const input = document.getElementById('new-competitor-site');
  const site = input.value.trim();
  if (!site || !currentModalClientId) return;
  try {
    await rpc('addCompetitor', currentModalClientId, site);
    input.value = '';
    showToast('Competitor added', 'success');
    loadCompetitorsList(currentModalClientId);
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function deleteCompetitorHandler(id) {
  try {
    await rpc('deleteCompetitor', id);
    showToast('Competitor removed', 'success');
    loadCompetitorsList(currentModalClientId);
  } catch (e) {
    showToast(e.message, 'error');
  }
}

/* ═══════════════════════════════════════════
   COMPARE
   ═══════════════════════════════════════════ */

async function loadCompareFilters() {
  const sel = document.getElementById('compare-client');
  try {
    if (!clientsCache.length) clientsCache = await rpc('getClients');
    sel.innerHTML = '<option value="">-- Select Client --</option>' +
      clientsCache.map(c => `<option value="${c.id}">${esc(c.client_site)}</option>`).join('');
    sel.onchange = loadPeriods;
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function loadPeriods() {
  const clientId = document.getElementById('compare-client').value;
  const sel = document.getElementById('compare-period');
  sel.innerHTML = '<option value="">Loading...</option>';
  if (!clientId) { sel.innerHTML = '<option value="">-- Period --</option>'; return; }
  try {
    const periods = await rpc('getAvailablePeriods', clientId);
    sel.innerHTML = periods.length
      ? periods.map(p => `<option value="${p}">${p}</option>`).join('')
      : '<option value="">No data</option>';
  } catch (e) {
    sel.innerHTML = '<option value="">Error</option>';
  }
}

async function loadComparison() {
  const clientId = document.getElementById('compare-client').value;
  const period = document.getElementById('compare-period').value;
  const wrap = document.getElementById('compare-table-wrap');
  if (!clientId || !period) { showToast('Select client and period', 'error'); return; }

  wrap.innerHTML = '<p class="loading">Loading...</p>';
  try {
    const data = await rpc('getDataForPeriod', clientId, period);
    if (!data.length) { wrap.innerHTML = '<p class="hint">No data for this period.</p>'; return; }
    renderComparisonTable(data, wrap);
  } catch (e) {
    wrap.innerHTML = '<p class="loading">Error: ' + e.message + '</p>';
  }
}

function renderComparisonTable(data, wrap) {
  const cols = [
    { key: 'site', label: 'Site' },
    { key: 'site_type', label: 'Type' },
    { key: 'monthly_visits', label: 'Monthly Visits' },
    { key: 'unique_visitors', label: 'Unique Visitors' },
    { key: 'visit_duration', label: 'Duration' },
    { key: 'pages_per_visit', label: 'Pages/Visit' },
    { key: 'bounce_rate', label: 'Bounce Rate' },
    { key: 'visits_per_visitor', label: 'Visits/Visitor' },
    { key: 'deduplicated_audience', label: 'Dedup. Audience' },
    { key: 'page_views', label: 'Page Views' },
    { key: 'direct', label: 'Direct' },
    { key: 'organic_search', label: 'Organic' },
    { key: 'paid_search', label: 'Paid' },
    { key: 'display_ads', label: 'Display' },
    { key: 'social_organic', label: 'Social Organic' },
    { key: 'social_paid', label: 'Social Paid' },
    { key: 'email', label: 'Email' },
    { key: 'affiliates', label: 'Affiliates' },
    { key: 'gen_ai', label: 'Gen AI' },
    { key: 'ai_traffic', label: 'AI Traffic' }
  ];

  let html = '<table class="data-table"><thead><tr>';
  cols.forEach(c => html += '<th>' + c.label + '</th>');
  html += '</tr></thead><tbody>';
  data.forEach(row => {
    const cls = row.site_type === 'client' ? 'type-client' : 'type-competitor';
    html += '<tr>';
    cols.forEach(c => {
      const val = row[c.key] || '-';
      html += `<td class="${c.key === 'site' || c.key === 'site_type' ? cls : ''}">${esc(String(val))}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

/* ═══════════════════════════════════════════
   QUEUE
   ═══════════════════════════════════════════ */

async function loadQueue() {
  try {
    const [summary, tasks] = await Promise.all([
      rpc('getQueueSummary'),
      rpc('getQueueStatus')
    ]);
    renderQueueSummary(summary);
    renderQueueTable(tasks);
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function renderQueueSummary(s) {
  const wrap = document.getElementById('queue-summary');
  wrap.innerHTML = ['pending', 'processing', 'done', 'error'].map(key =>
    `<div class="summary-card ${key}"><div class="num">${s[key]}</div><div class="label">${key}</div></div>`
  ).join('') + `<div class="summary-card"><div class="num">${s.total}</div><div class="label">Total</div></div>`;
}

function renderQueueTable(tasks) {
  const wrap = document.getElementById('queue-table-wrap');
  if (!tasks.length) { wrap.innerHTML = '<p class="hint">Queue is empty.</p>'; return; }

  let html = '<table class="data-table"><thead><tr><th>Client</th><th>Period</th><th>Sites</th><th>Status</th><th>Created</th></tr></thead><tbody>';
  tasks.forEach(t => {
    const statusCls = t.status === 'done' ? 'type-client' : t.status === 'error' ? 'btn-danger' : '';
    html += `<tr>
      <td>${esc(t.client_site)}</td>
      <td>${esc(t.period)}</td>
      <td>${esc(t.sites_list || '').substring(0, 60)}</td>
      <td><span class="chip">${esc(t.status)}</span></td>
      <td>${formatDate(t.created_at)}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

/* ═══════════════════════════════════════════
   SETTINGS
   ═══════════════════════════════════════════ */

async function loadSettings() {
  try {
    const s = await rpc('getSettings');
    document.getElementById('sb-url').value = s.url || '';
    document.getElementById('sb-key').value = s.hasKey ? '********' : '';
  } catch (e) {}
}

async function saveSettingsHandler() {
  const url = document.getElementById('sb-url').value.trim();
  const key = document.getElementById('sb-key').value.trim();
  if (!url || !key || key === '********') { showToast('Fill in both fields', 'error'); return; }

  const status = document.getElementById('settings-status');
  status.textContent = 'Testing...';
  status.className = '';

  try {
    const result = await rpc('saveSettings', url, key);
    if (result.ok) {
      status.textContent = 'Connected! ' + result.clientCount + ' clients found.';
      status.className = 'ok';
      showToast('Settings saved', 'success');
    } else {
      status.textContent = 'Error: ' + result.error;
      status.className = 'err';
    }
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    status.className = 'err';
  }
}

/* ─── Helpers ────────────────────────────── */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatDate(iso) { if (!iso) return '-'; return new Date(iso).toLocaleDateString('ru-RU'); }

/* ─── Init ───────────────────────────────── */
loadClients();
</script>
